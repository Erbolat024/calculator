<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>4-тапсырма — Карандашпен бояу</title>
  <link rel="stylesheet" href="css/task4.css" />
</head>
<body>
  <div class="page">
    <header class="topbar">
      <a href="index.html" class="back-btn">← Артқа</a>
      <div class="task-badge">4-тапсырма</div>
    </header>

    <section class="title-block">
      <h1>Суретті боя</h1>
      <p>Қызыл және көк түсті таңдап, суретті карандаш сияқты боя.</p>
    </section>

    <div class="tools">
      <button class="tool-btn red active" data-color="#e53935">Қызыл</button>
      <button class="tool-btn blue" data-color="#2563eb">Көк</button>
      <button class="tool-btn skin" data-color="#f2c6a0">Дене түсі</button>
      <button class="tool-btn eraser" id="eraserBtn">Өшіргіш</button>

      <label class="size-label">
        Қалыңдығы:
        <input type="range" id="brushSize" min="2" max="30" value="8" />
      </label>

      <button class="clear-btn" id="clearBtn">Тазалау</button>
    </div>

    <div class="canvas-wrap" id="canvasWrap">
      <img src="images/img2.jpeg" alt="Қанайналым жүйесі" id="baseImage" />
      <canvas id="paintCanvas"></canvas>
    </div>
  </div>

  <script src="js/task4.js"></script>
</body>
</html>
