<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>1-тапсырма — Сәйкестендіру</title>
  <link rel="stylesheet" href="css/task1.css" />
</head>
<body>
  <div class="page">
    <header class="topbar">
      <a href="index.html" class="back-btn">← Артқа</a>
      <div class="task-badge">1-тапсырма</div>
      <div class="score-box">⭐ <span id="score">0</span> ұпай</div>
    </header>

    <section class="title-block">
      <h1>Сәйкестендіру тапсырмасы</h1>
      <p>Нөмірлерді тиісті атаулармен сәйкестендіріңіз.</p>
    </section>

    <main class="task-layout">
      <div class="image-box">
        <img src="images/img1.jpeg" alt="Қанайналым жүйесі" class="main-image" />
      </div>

      <div class="table-box">
        <h2>Мүшелерді жұптастыру</h2>

        <table class="match-table">
          <thead>
            <tr>
              <th>Суреттегі №</th>
              <th>Мүше атауы</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>1</td>
              <td>
                <select id="answer1">
                  <option value="">Таңдаңыз</option>
                  <option value="Жүрек">Жүрек</option>
                  <option value="Көк тамыр">Көк тамыр</option>
                  <option value="Қылтамыр">Қылтамыр</option>
                  <option value="Күре тамыр">Күре тамыр</option>
                </select>
              </td>
            </tr>
            <tr>
              <td>2</td>
              <td>
                <select id="answer2">
                  <option value="">Таңдаңыз</option>
                  <option value="Жүрек">Жүрек</option>
                  <option value="Көк тамыр">Көк тамыр</option>
                  <option value="Қылтамыр">Қылтамыр</option>
                  <option value="Күре тамыр">Күре тамыр</option>
                </select>
              </td>
            </tr>
            <tr>
              <td>3</td>
              <td>
                <select id="answer3">
                  <option value="">Таңдаңыз</option>
                  <option value="Жүрек">Жүрек</option>
                  <option value="Көк тамыр">Көк тамыр</option>
                  <option value="Қылтамыр">Қылтамыр</option>
                  <option value="Күре тамыр">Күре тамыр</option>
                </select>
              </td>
            </tr>
            <tr>
              <td>4</td>
              <td>
                <select id="answer4">
                  <option value="">Таңдаңыз</option>
                  <option value="Жүрек">Жүрек</option>
                  <option value="Көк тамыр">Көк тамыр</option>
                  <option value="Қылтамыр">Қылтамыр</option>
                  <option value="Күре тамыр">Күре тамыр</option>
                </select>
              </td>
            </tr>
          </tbody>
        </table>

        <div class="button-group">
          <button class="check-btn" onclick="checkAnswers()">Тексеру</button>
          <button class="reset-btn" onclick="resetAnswers()">Қайта бастау</button>
        </div>

        <div class="result-box" id="resultBox">
          Жауаптарыңызды тексеріңіз.
        </div>
      </div>
    </main>
  </div>

  <script src="js/task1.js"></script>
</body>
</html>
